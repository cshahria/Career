<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Projection Calculator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px 10px;
      max-width: 900px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.3;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 1.2rem; font-weight: 600; }
    .btn { padding: 4px 10px; font-size: 0.8rem; font-weight: 500; border: none; border-radius: 5px; cursor: pointer; background: #0f172a; color: #fff; text-decoration: none; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat-box .val { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .stat-box .lbl { color: var(--muted); font-size: 0.75rem; font-weight: 500; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 3px 4px; border-bottom: 1px solid var(--border); text-align: center; }
    th { background: #f1f5f9; color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
    input[type="time"], input[type="number"] { padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; text-align: center; width: 95px; }
    .note { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🔮 Weekly Projection Calculator</h1>
    </div>
    <div style="display: flex; gap: 6px;">
      <a class="btn btn-secondary" href="index.html">← Back to Main Tracker</a>
      <button class="btn" onclick="resetToTypicalSchedule()">Reset to Typical Schedule</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom: 8px;">
      <label style="font-weight:600; font-size:0.8rem;">Banked OT (mins):</label>
      <input type="number" id="bankedOtMins" value="0" style="width: 70px;" oninput="saveBankedOt(); calculateProjections();">
      <span class="note">(e.g., 180 = +03:00 carryover)</span>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div id="projectedWorked" class="val">00:00</div>
        <div class="lbl">Projected Work Hours</div>
      </div>
      <div class="stat-box">
        <div id="totalWithOt" class="val" style="color: var(--success);">00:00</div>
        <div class="lbl">Total Incl. Banked OT</div>
      </div>
      <div class="stat-box">
        <div id="goalDifference" class="val">00:00</div>
        <div class="lbl">Variance (vs 40:00)</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Start</th>
            <th>Lunch Out</th>
            <th>Lunch In</th>
            <th>End</th>
            <th>After Start</th>
            <th>After End</th>
            <th>Daily Total</th>
          </tr>
        </thead>
        <tbody id="projectionBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    
    // Default schedule: Mon-Fri 07:30 to 16:30 with 30-min lunch (8 hrs/day)
    const TYPICAL_SCHEDULE = {
      Mon: { s1: '07:30', l1: '12:00', l2: '12:30', e1: '16:30', s2: '', e2: '' },
      Tue: { s1: '07:30', l1: '12:00', l2: '12:30', e1: '16:30', s2: '', e2: '' },
      Wed: { s1: '07:30', l1: '12:00', l2: '12:30', e1: '16:30', s2: '', e2: '' },
      Thu: { s1: '07:30', l1: '12:00', l2: '12:30', e1: '16:30', s2: '', e2: '' },
      Fri: { s1: '07:30', l1: '12:00', l2: '12:30', e1: '16:30', s2: '', e2: '' },
      Sat: { s1: '', l1: '', l2: '', e1: '', s2: '', e2: '' },
      Sun: { s1: '', l1: '', l2: '', e1: '', s2: '', e2: '' }
    };

    function loadSchedule() {
      const saved = localStorage.getItem('weekly_projection_schedule');
      return saved ? JSON.parse(saved) : TYPICAL_SCHEDULE;
    }

    function timeToMins(t) {
      if (!t) return null;
      const parts = t.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function minsToLabel(mins) {
      const sign = mins < 0 ? '-' : '';
      const abs = Math.abs(mins);
      const h = Math.floor(abs / 60);
      const m = Math.round(abs % 60);
      return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function renderTable() {
      const sched = loadSchedule();
      
      const savedOt = localStorage.getItem('weekly_projection_ot') || '0';
      document.getElementById('bankedOtMins').value = savedOt;

      let html = '';

      DAYS.forEach(day => {
        const d = sched[day] || {};
        html += `
          <tr>
            <td><b>${day}</b></td>
            <td><input type="time" value="${d.s1 || ''}" onchange="updateDay('${day}', 's1', this.value)"></td>
            <td><input type="time" value="${d.l1 || ''}" onchange="updateDay('${day}', 'l1', this.value)"></td>
            <td><input type="time" value="${d.l2 || ''}" onchange="updateDay('${day}', 'l2', this.value)"></td>
            <td><input type="time" value="${d.e1 || ''}" onchange="updateDay('${day}', 'e1', this.value)"></td>
            <td><input type="time" value="${d.s2 || ''}" onchange="updateDay('${day}', 's2', this.value)"></td>
            <td><input type="time" value="${d.e2 || ''}" onchange="updateDay('${day}', 'e2', this.value)"></td>
            <td id="total-${day}" style="font-weight:600;">00:00</td>
          </tr>
        `;
      });
      document.getElementById('projectionBody').innerHTML = html;
      calculateProjections();
    }

    function saveBankedOt() {
      const val = document.getElementById('bankedOtMins').value;
      localStorage.setItem('weekly_projection_ot', val);
    }

    function updateDay(day, field, val) {
      const sched = loadSchedule();
      if (!sched[day]) sched[day] = {};
      sched[day][field] = val;
      localStorage.setItem('weekly_projection_schedule', JSON.stringify(sched));
      calculateProjections();
    }

    function calculateProjections() {
      const sched = loadSchedule();
      let weeklyMins = 0;

      DAYS.forEach(day => {
        const d = sched[day] || {};
        let dayMins = 0;

        // Primary Shift
        const s1 = timeToMins(d.s1), l1 = timeToMins(d.l1), l2 = timeToMins(d.l2), e1 = timeToMins(d.e1);
        if (s1 !== null && e1 !== null && e1 > s1) {
          dayMins += (e1 - s1);
          if (l1 !== null && l2 !== null && l2 > l1) {
            dayMins -= (l2 - l1);
          }
        }

        // After Hours Shift
        const s2 = timeToMins(d.s2), e2 = timeToMins(d.e2);
        if (s2 !== null && e2 !== null && e2 > s2) {
          dayMins += (e2 - s2);
        }

        document.getElementById(`total-${day}`).innerText = minsToLabel(dayMins);
        weeklyMins += dayMins;
      });

      const bankedOt = parseInt(document.getElementById('bankedOtMins').value, 10) || 0;
      const totalWithOt = weeklyMins + bankedOt;
      const targetDiff = totalWithOt - 2400; // 2400 mins = 40 hours

      document.getElementById('projectedWorked').innerText = minsToLabel(weeklyMins);
      document.getElementById('totalWithOt').innerText = minsToLabel(totalWithOt);
      
      const diffEl = document.getElementById('goalDifference');
      diffEl.innerText = (targetDiff >= 0 ? '+' : '') + minsToLabel(targetDiff);
      diffEl.style.color = targetDiff >= 0 ? 'var(--success)' : 'var(--danger)';
    }

    function resetToTypicalSchedule() {
      localStorage.setItem('weekly_projection_schedule', JSON.stringify(TYPICAL_SCHEDULE));
      localStorage.setItem('weekly_projection_ot', '0');
      document.getElementById('bankedOtMins').value = 0;
      renderTable();
    }

    window.onload = renderTable;
  </script>
</body>
</html>
