<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Unit Price Compare</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--card:#fff;--ink:#111827;--mute:#4b5563;--line:#9ca3af;--blue:#0b4fd1;--green:#0a6b2d;--greenbg:#e3f6e8;--red:#b00020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{font-size:20px;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;line-height:1.4;padding:12px}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.4rem;margin:0}
.sz{display:flex;gap:6px}
.sz button{min-width:52px;height:52px;font-size:1.1rem;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px}
.card{background:var(--card);border:2px solid #d1d5db;border-radius:16px;padding:16px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 12px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;height:58px;font-size:1.1rem;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,button:focus-visible{outline:4px solid #7aa7ff;outline-offset:1px;border-color:var(--blue)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.row .w2{flex:1.3}
.step{display:flex;gap:8px}
.step button{width:58px;flex:none;height:58px;font-size:1.6rem;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px}
.hint{color:var(--mute);font-size:.85rem;margin-top:4px}
.preview{margin-top:16px;padding:14px;border-radius:12px;background:#eef3ff;border:2px solid #b8cdfa;min-height:84px}
.preview .big{font-size:1.5rem;font-weight:800;color:var(--blue)}
.preview .sm{font-size:.9rem;color:var(--mute)}
.add{width:100%;height:64px;margin-top:14px;font-size:1.2rem;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:14px}
.add:disabled{background:#9ca3af}
.grp{font-size:1rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;margin:18px 4px 8px}
.item{background:var(--card);border:2px solid #d1d5db;border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.item.best{border:4px solid var(--green);background:var(--greenbg)}
.badge{display:inline-block;background:var(--green);color:#fff;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:20px;margin-bottom:6px}
.more{display:inline-block;font-weight:700;color:var(--red);font-size:.9rem;margin-bottom:6px}
.name{font-weight:800;font-size:1.15rem;padding-right:60px;overflow-wrap:anywhere}
.desc{color:var(--mute);font-size:.9rem;margin:2px 0 8px}
.price{font-size:1.9rem;font-weight:800}
.price span{font-size:1rem;font-weight:700;color:var(--mute)}
.alt{font-size:.95rem;color:var(--ink);margin-top:2px}
.del{position:absolute;top:8px;right:8px;width:52px;height:52px;border:2px solid var(--red);background:#fff;color:var(--red);font-size:1.5rem;font-weight:700;border-radius:12px}
.empty{text-align:center;color:var(--mute);padding:20px;font-weight:600}
.tools{display:flex;gap:10px;margin-top:8px}
.tools button{flex:1;height:58px;font-size:1rem;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px}
.tools .clr{border-color:var(--red);color:var(--red)}
.note{font-size:.85rem;color:var(--mute);margin:10px 4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Unit Price Compare</h1>
  <div class="sz" aria-label="Text size"><button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Larger text">A+</button></div>
</header>

<section class="card" aria-labelledby="addh">
  <h2 id="addh">Add a product</h2>

  <label for="name">Name (optional)</label>
  <input id="name" type="text" placeholder="e.g. Sparkling water" autocomplete="off">

  <label for="price">Total price ($)</label>
  <input id="price" type="text" inputmode="decimal" placeholder="15.00" autocomplete="off">

  <label for="count">How many in the package?</label>
  <div class="step">
    <button type="button" id="minus" aria-label="One fewer">−</button>
    <input id="count" type="text" inputmode="numeric" value="1" aria-label="Number in package">
    <button type="button" id="plus" aria-label="One more">+</button>
  </div>
  <div class="hint">Use 1 for a single item. For a 20-pack, enter 20.</div>

  <label for="size">Size of each one</label>
  <div class="row">
    <input id="size" type="text" inputmode="decimal" placeholder="6" class="w2" autocomplete="off" aria-label="Size of each">
    <select id="unit" aria-label="Unit">
      <optgroup label="Liquid">
        <option value="floz">fl oz</option><option value="ml">mL</option><option value="l">Liter</option><option value="gal">Gallon</option>
      </optgroup>
      <optgroup label="Weight">
        <option value="oz">oz (weight)</option><option value="lb">lb</option><option value="g">grams</option><option value="kg">kg</option>
      </optgroup>
      <optgroup label="Count">
        <option value="each">each / sheets</option>
      </optgroup>
    </select>
  </div>

  <div class="preview" id="preview" aria-live="polite"><div class="sm">Enter a price and size to see the unit price.</div></div>
  <button class="add" id="add" disabled>Add to compare</button>
</section>

<div id="results"></div>

<div class="tools">
  <button id="share">Share list</button>
  <button id="clear" class="clr">Clear all</button>
</div>
<p class="note">Liquids are compared per fl oz, weights per oz, and counts per piece. Items are only ranked against the same kind.</p>
</div>

<script>
var U={floz:{t:"vol",f:1,l:"fl oz"},ml:{t:"vol",f:0.033814,l:"mL"},l:{t:"vol",f:33.814,l:"L"},gal:{t:"vol",f:128,l:"gal"},
oz:{t:"wt",f:1,l:"oz"},lb:{t:"wt",f:16,l:"lb"},g:{t:"wt",f:0.035274,l:"g"},kg:{t:"wt",f:35.274,l:"kg"},each:{t:"cnt",f:1,l:"each"}};
var TYPES={vol:{title:"Liquids",base:"fl oz"},wt:{title:"Weight",base:"oz"},cnt:{title:"Count",base:"each"}};
var KEY="unitPriceItems.v2",SKEY="unitPriceFont";
var items=[];
var $=function(id){return document.getElementById(id)};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function num(s){var n=parseFloat(String(s).replace(/[$,\s]/g,"").replace(",","."));return isFinite(n)?n:NaN}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function money(n,d){return "$"+n.toFixed(d===undefined?2:d)}
function fmtN(n){return +n.toFixed(2)+""}

function calc(it){
  var u=U[it.unit],total=it.count*it.size*u.f,per=it.price/total;
  return {type:u.t,total:total,per:per,each:it.price/it.count};
}
function lines(it,c){
  var u=U[it.unit],out=[];
  if(c.type==="vol"){out.push([money(c.per,3),"per fl oz"]);out.push(money(c.per*128,2)+" per gallon")}
  else if(c.type==="wt"){out.push([money(c.per,3),"per oz"]);out.push(money(c.per*16,2)+" per lb")}
  else{out.push([money(c.per,3),"each"])}
  return out;
}
function describe(it){
  var u=U[it.unit],s=it.count>1?it.count+" × "+fmtN(it.size)+" "+u.l:fmtN(it.size)+" "+u.l;
  if(it.count>1&&it.unit!=="each")s+=" = "+fmtN(it.count*it.size)+" "+u.l+" total";
  return money(it.price)+" for "+s;
}
function current(){
  var price=num($("price").value),count=Math.round(num($("count").value)),size=num($("size").value);
  if(!(price>0)||!(count>=1)||!(size>0))return null;
  return {name:$("name").value.trim(),price:price,count:count,size:size,unit:$("unit").value};
}
function preview(){
  var it=current(),p=$("preview"),b=$("add");
  b.disabled=!it;
  if(!it){p.innerHTML='<div class="sm">Enter a price and size to see the unit price.</div>';return}
  var c=calc(it),L=lines(it,c);
  var h='<div class="big">'+L[0][0]+" "+L[0][1]+"</div>";
  if(L[1])h+='<div class="sm">'+L[1]+"</div>";
  if(it.count>1)h+='<div class="sm">'+money(c.each)+" per item · "+describe(it).replace(/^\$[\d.]+ for /,"")+"</div>";
  p.innerHTML=h;
}
function render(){
  var box=$("results");
  if(!items.length){box.innerHTML='<div class="empty">Nothing added yet. Add your first product above.</div>';return}
  var html="";
  ["vol","wt","cnt"].forEach(function(t){
    var g=items.map(function(it,i){return {it:it,i:i,c:calc(it)}}).filter(function(x){return x.c.type===t});
    if(!g.length)return;
    g.sort(function(a,b){return a.c.per-b.c.per});
    var best=g[0].c.per;
    html+='<div class="grp">'+TYPES[t].title+" · cheapest first</div>";
    g.forEach(function(x,k){
      var isBest=k===0&&g.length>1,L=lines(x.it,x.c);
      html+='<div class="item'+(isBest?" best":"")+'">';
      html+='<button class="del" data-i="'+x.i+'" aria-label="Delete '+esc(x.it.name||"item")+'">×</button>';
      if(isBest)html+='<span class="badge">BEST PRICE</span>';
      else if(g.length>1)html+='<span class="more">'+Math.round((x.c.per/best-1)*100)+"% more than best</span>";
      html+='<div class="name">'+esc(x.it.name||"Item "+(x.i+1))+"</div>";
      html+='<div class="desc">'+describe(x.it)+"</div>";
      html+='<div class="price">'+L[0][0]+" <span>"+L[0][1]+"</span></div>";
      if(L[1])html+='<div class="alt">'+L[1]+"</div>";
      if(x.it.count>1)html+='<div class="alt">'+money(x.c.each)+" per item</div>";
      html+="</div>";
    });
  });
  box.innerHTML=html;
}
function setFont(px){px=Math.max(16,Math.min(32,px));document.documentElement.style.fontSize=px+"px";save(SKEY,px)}
function curFont(){return parseFloat(getComputedStyle(document.documentElement).fontSize)}

$("add").addEventListener("click",function(){
  var it=current();if(!it)return;
  items.push(it);save(KEY,items);
  ["name","price","size"].forEach(function(id){$(id).value=""});
  $("count").value="1";preview();render();
  $("results").scrollIntoView({behavior:"smooth",block:"start"});
});
["name","price","count","size","unit"].forEach(function(id){$(id).addEventListener("input",preview);$(id).addEventListener("change",preview)});
$("minus").addEventListener("click",function(){var n=Math.round(num($("count").value))||1;$("count").value=Math.max(1,n-1);preview()});
$("plus").addEventListener("click",function(){var n=Math.round(num($("count").value))||0;$("count").value=n+1;preview()});
$("results").addEventListener("click",function(e){
  var b=e.target.closest(".del");if(!b)return;
  if(!confirm("Delete this item?"))return;
  items.splice(+b.dataset.i,1);save(KEY,items);render();
});
$("clear").addEventListener("click",function(){
  if(!items.length)return;
  if(confirm("Clear all items and start over?")){items=[];save(KEY,items);render()}
});
$("share").addEventListener("click",function(){
  if(!items.length){alert("Add some items first.");return}
  var txt="Unit price comparison\n";
  ["vol","wt","cnt"].forEach(function(t){
    var g=items.map(function(it){return {it:it,c:calc(it)}}).filter(function(x){return x.c.type===t}).sort(function(a,b){return a.c.per-b.c.per});
    g.forEach(function(x,k){
      var L=lines(x.it,x.c);
      txt+="\n"+(k===0&&g.length>1?"★ BEST: ":"")+(x.it.name||"Item")+"\n"+describe(x.it)+"\n"+L[0][0]+" "+L[0][1]+"\n";
    });
  });
  if(navigator.share){navigator.share({title:"Unit price comparison",text:txt}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert("Copied to clipboard.")},function(){alert(txt)})}
  else alert(txt);
});
$("bigger").addEventListener("click",function(){setFont(curFont()+2)});
$("smaller").addEventListener("click",function(){setFont(curFont()-2)});

items=load(KEY,[]);if(!Array.isArray(items))items=[];
var f=load(SKEY,null);if(f)setFont(f);
preview();render();
</script>
</body>
</html>
